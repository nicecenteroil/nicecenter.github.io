<!doctype html>
<!-- slip.nicecenter.co.th — หน้าห่อ NCO Slip Admin (GAS web app) ให้ลิงก์สั้นลง
     ลิงก์: https://slip.nicecenter.co.th/?k=<key> → ส่ง ?k ต่อให้ GAS ใน iframe
     ไม่มีข้อมูลลับในไฟล์นี้ (key อยู่ในลิงก์ของแต่ละคน) -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>สลิปโอนเงิน · NCO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E8631A'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#F6F7F9}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .msg{font-family:sans-serif;padding:40px 16px;text-align:center;color:#57606A}
</style>
</head>
<body>
<script>
  // วาง URL /exec ของ deployment NCO Slip Admin (Deploy → Manage deployments → Web app URL)
  var EXEC = 'https://script.google.com/macros/s/AKfycbxAENEER_DxDB57p-wwIunehhuTMrOLvKkc3WiW-re3Lh9l_YUrmQ_8zWNdh7egrbG4GA/exec';
  var k = new URLSearchParams(location.search).get('k') || '';
  if (!k) {
    document.body.innerHTML = '<p class="msg">ลิงก์ไม่ครบ — ใช้ลิงก์ส่วนตัวที่ได้รับทาง LINE</p>';
  } else {
    var f = document.createElement('iframe');
    f.src = EXEC + '?k=' + encodeURIComponent(k);
    f.title = 'สลิปโอนเงิน';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
